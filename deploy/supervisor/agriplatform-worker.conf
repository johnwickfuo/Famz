; Queue workers.
;
; Two pools, deliberately.
;
; The default pool carries payment webhooks, escrow releases, ledger writes and
; notifications — work where a delay has consequences. The mail pool carries
; nothing but outbound email.
;
; They are separated because mail is the slowest thing the platform does and the
; most likely to hang: a provider that takes thirty seconds to answer, or times
; out and retries, holds a worker for that whole time. On one shared queue a
; hundred welcome emails put a payment confirmation behind half an hour of SMTP.
;
; Paths below assume the HestiaCP layout. Replace APP_PATH and APP_USER with the
; real values before installing; they are written out in full rather than
; templated so that a copy-paste into /etc/supervisor/conf.d/ is a working file.
;
;   supervisorctl reread && supervisorctl update && supervisorctl status

[program:agriplatform-default]
process_name=%(program_name)s_%(process_num)02d
command=php /home/agriplatform/web/staging.example.com/public_html/artisan queue:work redis --queue=default --sleep=3 --tries=3 --max-time=3600 --backoff=10
directory=/home/agriplatform/web/staging.example.com/public_html
autostart=true
autorestart=true
; Never root. A queue worker executes application code, and application code
; should not be able to write outside the deployment.
user=agriplatform
numprocs=2
redirect_stderr=true
stdout_logfile=/home/agriplatform/web/staging.example.com/public_html/storage/logs/worker-default.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
; Long enough for a running job to finish after a deploy signals a restart.
; A shorter value kills a job mid-transaction, which on the payment queue is
; the one thing worth avoiding.
stopwaitsecs=3600
stopasgroup=true
killasgroup=true

[program:agriplatform-mail]
process_name=%(program_name)s_%(process_num)02d
; --tries=5 with a longer backoff: a mail provider being briefly unreachable is
; ordinary, and giving up after three attempts loses a password reset somebody
; is sitting waiting for.
command=php /home/agriplatform/web/staging.example.com/public_html/artisan queue:work redis --queue=mail --sleep=5 --tries=5 --max-time=3600 --backoff=30
directory=/home/agriplatform/web/staging.example.com/public_html
autostart=true
autorestart=true
user=agriplatform
numprocs=1
redirect_stderr=true
stdout_logfile=/home/agriplatform/web/staging.example.com/public_html/storage/logs/worker-mail.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=120
stopasgroup=true
killasgroup=true

[group:agriplatform]
programs=agriplatform-default,agriplatform-mail
priority=999
